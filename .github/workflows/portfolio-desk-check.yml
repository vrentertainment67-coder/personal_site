name: Portfolio desk — check

# Run this by hand: Actions → Portfolio desk — check → Run workflow.
# GitHub's runners have open network access, so this reaches Yahoo, NSE and
# Google News without any environment settings. `verify-symbols` and `holidays`
# need no secrets at all.

on:
  # A push to the working branch runs the desk for real, so the dashboard can be
  # seen with live data before anything is merged. It commits the built page
  # back with "[desk]" in the message, and skips itself on that commit.
  push:
    branches:
      - "claude/**"
    paths-ignore:
      - "portfolio-desk/site/**"
      - "portfolio-desk/data/**"
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        default: verify-symbols
        options:
          - verify-symbols
          - holidays
          - dry-run
          - dry-run-no-brief

defaults:
  run:
    working-directory: portfolio-desk

jobs:
  check:
    if: "!contains(github.event.head_commit.message, '[desk]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TZ: Asia/Kolkata
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5-5' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portfolio-desk/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: pip install pytest && python -m pytest tests -q

      - name: Run
        id: run
        env:
          TASK: ${{ inputs.task || 'dry-run-no-brief' }}
        run: |
          set -o pipefail
          case "$TASK" in
            verify-symbols)    python -m desk verify-symbols --json-out verify.json | tee out.txt ;;
            holidays)          python -m desk holidays --refresh | tee out.txt ;;
            dry-run)           python -m desk run --dry-run --force | tee out.txt ;;
            dry-run-no-brief)  python -m desk run --dry-run --no-brief --force | tee out.txt ;;
          esac

      - name: Also verify the tickers
        if: github.event_name == 'push'
        continue-on-error: true
        run: python -m desk verify-symbols --json-out verify.json | tee verify.txt

      - name: Commit the built page back
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          git config user.name "portfolio-desk"
          git config user.email "noreply@github.com"
          git add -A site data verify.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "[desk] live build $(date +%F\ %H:%M)"
          git push

      - name: Report
        if: always()
        run: |
          {
            echo "## ${{ inputs.task || 'dry-run-no-brief' }}"
            echo '```'
            cat out.txt 2>/dev/null || echo "(no output — see the step log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desk-${{ inputs.task || 'push' }}
          path: |
            portfolio-desk/out.txt
            portfolio-desk/verify.txt
            portfolio-desk/verify.json
            portfolio-desk/site/index.html
            portfolio-desk/data/nse-holidays-*.json
          if-no-files-found: ignore
          retention-days: 14
