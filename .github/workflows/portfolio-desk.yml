name: Portfolio morning desk

on:
  schedule:
    # 03:00 UTC = 08:30 IST, Monday to Friday. The job itself checks the NSE
    # holiday list and exits early when the market is shut.
    - cron: "0 3 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the market is closed"
        type: boolean
        default: false
      dry_run:
        description: "Build everything, send nothing"
        type: boolean
        default: false

concurrency:
  group: portfolio-desk
  cancel-in-progress: false

defaults:
  run:
    working-directory: portfolio-desk

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TZ: Asia/Kolkata
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5-5' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Job-level so the deploy step's `if` can test it: the secrets context is
      # not available in a step-level condition.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portfolio-desk/requirements.txt

      - name: Install
        run: pip install -r requirements.txt anthropic

      - name: Is the market open?
        id: calendar
        run: |
          python -m desk holidays --refresh || true
          if python -c "
          import sys
          from desk import trading_days
          sys.exit(0 if trading_days.status().is_open else 1)
          "; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "Market closed today — stopping here." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run the desk
        if: steps.calendar.outputs.open == 'true' || inputs.force
        run: |
          python -m desk run \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            | tee run.log
          {
            echo '## Portfolio desk'
            echo '```'
            tail -40 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to Cloudflare Pages
        if: |
          (steps.calendar.outputs.open == 'true' || inputs.force) &&
          !inputs.dry_run && env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@3 pages deploy site --project-name portfolio-desk --branch main

      - name: Commit the day's output
        if: steps.calendar.outputs.open == 'true' || inputs.force
        run: |
          rm -f run.log
          git config user.name "portfolio-desk"
          git config user.email "noreply@github.com"
          git add -A site data/levels data/nse-holidays-*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Desk: $(date +%F)"
          git push
